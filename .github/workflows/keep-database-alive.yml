name: Keep Database Alive

on:
  schedule:
    # Run every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-database-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Keep Supabase Database Alive
        run: |
          curl -X GET 'https://mhjjbbucvgdlfiwrgcdx.supabase.co/rest/v1/todos?limit=1' \
            -H 'apikey: sb_publishable_z7ODrUpp-Gb5XCyNt27liw_BY_DpD-3' \
            -H 'Authorization: Bearer sb_publishable_z7ODrUpp-Gb5XCyNt27liw_BY_DpD-3' \
            -H 'Content-Type: application/json'
        
      - name: Log Success
        if: success()
        run: echo 'Database keep-alive check completed successfully'
        
      - name: Log Failure
        if: failure()
        run: echo 'Database keep-alive check failed'
